# Safety-first CI for the nmap C-to-Rust port (nmap-rs/ workspace).
# Adapted from porting-kit/harnesses/ci/porting-ci.template.yml. Organized around
# the kit's SAFETY GATES, not OS coverage.
#
# LESSONS #5 — path-scoped to nmap-rs/** + porting-kit/** so it never triggers the
# heavy C autotools build (build.yml), and the C build never triggers on Rust-only
# changes (see the paths added to build.yml).
name: nmap-rs-ci

# `push` is scoped to master ONLY. Including 'claude/**' here ran the entire
# pipeline TWICE for every PR — once for the branch push, once for the pull_request
# — which is why this workflow reported 22 checks instead of 11. A PR's own
# `pull_request` run already covers the branch (and covers it better: it tests the
# merge commit, not the branch head in isolation), and re-runs on every force-push
# via the default `synchronize` activity. The push trigger's remaining job is master
# after a merge. Trade-off, deliberately accepted: a `claude/**` branch pushed with
# NO open pull request is not built until a PR is opened for it.
on:
  push:
    branches: [master]
    paths: ['nmap-rs/**', 'porting-kit/**', '.github/workflows/nmap-rs-ci.yml']
  pull_request:
    paths: ['nmap-rs/**', 'porting-kit/**', '.github/workflows/nmap-rs-ci.yml']

# Supersede a PR's in-flight run when it is force-pushed: with a ~40-minute fuzz
# matrix, a stale run is pure waste and its result is about code that no longer
# exists. Never cancel on master — an intermediate merge commit's result is the only
# evidence that commit was ever green, so those runs are allowed to finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: nmap-rs

jobs:
  build-test:
    name: build + test + clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned via nmap-rs/rust-toolchain.toml so local `cargo fmt`/`cargo clippy`
      # match CI exactly — no more floating-@stable rustfmt/clippy skew (LESSONS #16).
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0", components: clippy, rustfmt }
      - run: cargo fmt --all -- --check
      # -D warnings escalates the workspace safety lints (arithmetic_side_effects,
      # cast_possible_truncation, undocumented_unsafe_blocks, missing_safety_doc)
      # to hard errors. Explicit -D flags are belt-and-suspenders (LESSONS #3).
      - run: >
          cargo clippy --all-targets --
          -D warnings
          -D clippy::missing_safety_doc
          -D clippy::undocumented_unsafe_blocks
      - run: cargo test --all

  # Builds the workspace at the DECLARED MSRV, so `rust-version` is a promise the
  # repo keeps rather than a number nobody checks. It sat at "1.74" through five
  # milestones while the tree had long since needed 1.88 — nothing ever built at it,
  # because every other job pins 1.97.0 via rust-toolchain.toml.
  #
  # The toolchain is READ FROM the declaration instead of hardcoded here. A second
  # hardcoded version would be a second thing to forget, and the failure mode is
  # silent: the gate would keep passing against a number the manifest no longer
  # claims. Bumping `rust-version` is therefore the whole change — this job follows.
  #
  # `cargo +<msrv>` is explicit for the same reason the nightly gates use
  # `cargo +nightly`: rust-toolchain.toml is a DIRECTORY override that otherwise
  # outranks whatever the action installed, and the job would silently test 1.97
  # (LESSONS #16).
  msrv:
    name: MSRV (workspace builds at the declared rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: declared
        run: |
          v=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$v" ]; then echo "no rust-version in nmap-rs/Cargo.toml" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "declared MSRV: $v"
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ steps.declared.outputs.version }}" }
      # --all-targets so tests and fuzz-adjacent targets are covered too, and
      # --all-features so the off-by-default `pcap` path cannot quietly need newer.
      - run: cargo +${{ steps.declared.outputs.version }} check --workspace --all-targets
      - run: cargo +${{ steps.declared.outputs.version }} check --workspace --all-targets --all-features

  unsafe-audit:
    name: unsafe-audit (hard fail on undocumented unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Fails if ANY `unsafe {}` block lacks a // SAFETY: comment. Run from repo
      # root against the workspace crates.
      - run: python3 porting-kit/harnesses/unsafe-audit/audit_unsafe.py nmap-rs/crates/
        working-directory: .

  supply-chain:
    name: supply-chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master  # pinned via rust-toolchain.toml (LESSONS #16)
        with: { toolchain: "1.97.0" }
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  miri:
    name: miri (UB in unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - run: cargo +nightly miri test

  # NOTE: no ThreadSanitizer gate. The host-group driver's race-freedom is
  # *structural* — all scheduler state is mutated by the single driver task and
  # probe tasks capture only `Copy`/owned data, so `JoinSet::spawn`'s `Send`
  # bound rejects shared mutable state at compile time. Full-program TSan of a
  # tokio multi-threaded runtime reports false positives from tokio's own
  # lock-free scheduler (and app code runs *inside* the runtime, so suppressions
  # can't cleanly separate the two), which makes it an unsound gate here rather
  # than a safe one. See LESSONS (M2 retrospective).

  # --- Gates below activate as their inputs land (kept wired, self-skip until then) ---

  # Sharded across a matrix: the smoke is 60s PER TARGET, so a single job grew to
  # ~38 minutes of pure fuzzing as targets accumulated. Each shard fuzzes a slice, so
  # wall-clock is the slice plus fixed overhead rather than the whole battery.
  # `fail-fast: false` because a crash in one shard must not cancel the others — the
  # point of this gate is to see every failure, not the first.
  fuzz-smoke:
    name: fuzz shard ${{ matrix.shard }} (60s smoke per untrusted-input parser)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src }
      - run: |
          if [ ! -d fuzz ]; then echo "no fuzz/ dir yet — skipping"; exit 0; fi
          cargo install cargo-fuzz --locked
      # Compile every target BEFORE fuzzing any of them. `cargo clippy --workspace
      # --all-targets` does not build fuzz/ — it is a separate crate — so adding a
      # field to a type a fuzz target constructs passes every local and CI check
      # except this job. Without this step that compile error surfaces only after the
      # first target has already fuzzed for 60s, well into the run; with it the shard
      # fails in about a minute. Cost three red runs before it was added (LESSONS #023).
      # Every shard builds everything: `fuzz build` with no target name is one
      # invocation sharing codegen, and it keeps each shard self-contained (no
      # artifact plumbing) while still failing fast.
      - name: fuzz targets compile
        run: |
          if [ ! -d fuzz ]; then echo "no fuzz/ dir yet — skipping"; exit 0; fi
          cargo +nightly fuzz build
      # Fuzz this shard's slice from each target's hand-authored seed corpus. Any
      # panic/crash on arbitrary input is a release blocker (Phase 4, gate 3).
      # Invoke with +nightly explicitly: cargo-fuzz needs -Zsanitizer, and the
      # repo's rust-toolchain.toml (a *directory* override, pinning stable) would
      # otherwise outrank the job's nightly default and fail the inner build
      # (LESSONS #16 — the pin interacts with nightly-only gates).
      #
      # Round-robin by line number, with the shard count taken from
      # `strategy.job-total` so the split follows the matrix automatically — adding a
      # shard needs no second edit here, and no target can be dropped or run twice.
      - name: fuzz smoke run
        run: |
          if [ ! -d fuzz ]; then echo "no fuzz/ dir yet — skipping"; exit 0; fi
          targets=$(cargo +nightly fuzz list \
            | awk -v s=${{ matrix.shard }} -v n=${{ strategy.job-total }} 'NR % n == s % n')
          if [ -z "$targets" ]; then
            echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }}: no targets"; exit 0
          fi
          echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }} runs:"; echo "$targets"
          for t in $targets; do
            cargo +nightly fuzz run "$t" fuzz/seeds/"$t" -- -max_total_time=60 -print_final_stats=1
          done

  differential:
    name: differential vs C nmap oracle (M1 connect scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master  # pinned via rust-toolchain.toml (LESSONS #16)
        with: { toolchain: "1.97.0" }
      # The C oracle: distro nmap. project.py compares only the semantic scan
      # result (host status + open-port state/reason + closed counts), so the
      # exact nmap version's decorative output does not affect the verdict.
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - run: cargo build --release
      # Fixture listeners + both binaries + diff_run.py over the M1 matrix.
      # Fails on any UNLEDGERED divergence in port-state fidelity.
      - run: bash tests/differential/run_differential.sh
      # M5: the OS-detection differential. Unlike every earlier M5 gate (static C-oracle
      # vectors, or the real nmap-os-db), this exercises the whole path on the wire —
      # building the 23-probe battery, capturing on a real interface, attributing replies,
      # and assembling a fingerprint — against C nmap fingerprinting the same host.
      # Needs raw sockets and a pcap build; the script SKIPs cleanly without them.
      - run: sudo apt-get install -y libpcap-dev
      - run: cargo build --release --features pcap
      - run: sudo -E env "PATH=$PATH" bash tests/differential/m5/run_os_differential.sh
      # M4/M5 packet-walk differential: rebuild the C PacketParser oracle and
      # regenerate the committed corpus + golden, then require them to be unchanged.
      # The cargo test compares against the committed golden, so without this step a
      # hand-edited golden would prove agreement with a paraphrase of the C rather
      # than with nmap itself.
      - run: bash tests/differential/m4/regen_pkt_golden.sh --check
      # M5 IPv6 probe battery: rebuild the C FPHost6::build_probe_list() oracle,
      # regenerate the committed corpus + golden, and require them unchanged, then run
      # the byte-exact differential. Same anti-paraphrase guard as the other goldens.
      - run: bash tests/differential/m5/regen_build6.sh --check
      - run: cargo test -p nmap-core --test build6_differential
      # M5 IPv6 response matching: rebuild nmap's real PacketParser::is_response oracle,
      # regenerate the committed corpus + golden, require them unchanged, then run the
      # verdict-exact differential.
      - run: bash tests/differential/m5/regen_fp6match.sh --check
      - run: cargo test -p nmap-core --test fp6match_differential
      # M5 IPv6: the classifier differential. Builds an oracle that links liblinear's own
      # predict_values against nmap's real 2.8 MB model tables, and requires bit-exact
      # agreement — the port replaces that whole library with a dot product, so "close
      # enough" is not a sufficient check.
      - run: bash tests/differential/m5/oracle/build_fp6_oracle.sh
      - run: cargo test -p nmap-core --test fpmodel_differential
      # M5 IPv6: the vectorize differential. Rebuilds nmap's real vectorize() (pasted
      # verbatim, linked against the real libnetutil parser), regenerates the committed
      # corpus + golden and requires them unchanged, then diffs the Rust port against it
      # bit-for-bit — the same re-derive-from-C guard the packet golden uses.
      - run: bash tests/differential/m5/regen_fp6_vectorize.sh --check
      - run: cargo test -p nmap-core --test fp6_vectorize_differential
      # M5 IPv6: the neighbor-discovery differential. Rebuilds nmap's real doND()
      # frame construction and reply validation (pasted verbatim, packed by the real
      # libdnet macros), regenerates the committed corpus + golden and requires them
      # unchanged, then gates the solicitation on byte identity and the advertisement
      # reader on verdict identity.
      - run: bash tests/differential/m5/regen_ndp.sh --check
      - run: cargo test -p nmap-core --test ndp_differential

      # Workstream S3b — the service-fingerprint builder. This is the only slice of
      # the signature-maintenance workstream with a C counterpart, so it is the only
      # one that can be differentialled at all; the rest are additive and gated by
      # golden + negative tests. The oracle pastes service_scan.cc's four builder
      # functions verbatim, and --check re-derives BOTH the corpus and the golden
      # from the C so neither can drift into agreeing with the port.
      - run: bash tests/differential/s/regen_servicefp.sh --check
      - run: cargo test -p nmap-core --test servicefp_differential

      # Workstream S4 — SHA-256. `core::sigstore::digest` is a hand-rolled hash
      # carried in-tree rather than taken as a dependency, so the gate that matters
      # is agreement with an INDEPENDENT implementation: the golden is produced by
      # the system sha256sum (coreutils) and re-derived here on every run. Comparing
      # against a second hand-rolled hash would prove only that the two agree.
      - run: bash tests/differential/s/regen_sha256.sh --check
      - run: cargo test -p nmap-core --test sha256_differential

      # Workstream S2 — Ed25519 / minisign verification. `core::sigstore::verify`
      # CONSUMES signatures, so the gate is that it accepts what an independent
      # signer produces and refuses that signer's near-misses: every signature in
      # the corpus is made by the OpenSSL CLI, and the generator refuses to emit
      # anything unless OpenSSL first reproduces the RFC 8032 vectors byte for byte.
      # --check re-derives the corpus, the golden AND the Rust fixtures the Miri-
      # visible unit tests `include!`, so those cannot drift from the corpus either.
      - run: bash tests/differential/s/regen_minisign.sh --check
      - run: cargo test -p nmap-core --test minisign_differential
