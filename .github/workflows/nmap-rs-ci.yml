# Safety-first CI for the nmap C-to-Rust port (nmap-rs/ workspace).
# Adapted from porting-kit/harnesses/ci/porting-ci.template.yml. Organized around
# the kit's SAFETY GATES, not OS coverage.
#
# LESSONS #5 — path-scoped to nmap-rs/** + porting-kit/** so it never triggers the
# heavy C autotools build (build.yml), and the C build never triggers on Rust-only
# changes (see the paths added to build.yml).
name: nmap-rs-ci

on:
  push:
    branches: [master, 'claude/**']
    paths: ['nmap-rs/**', 'porting-kit/**', '.github/workflows/nmap-rs-ci.yml']
  pull_request:
    paths: ['nmap-rs/**', 'porting-kit/**', '.github/workflows/nmap-rs-ci.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: nmap-rs

jobs:
  build-test:
    name: build + test + clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned via nmap-rs/rust-toolchain.toml so local `cargo fmt`/`cargo clippy`
      # match CI exactly — no more floating-@stable rustfmt/clippy skew (LESSONS #16).
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0", components: clippy, rustfmt }
      - run: cargo fmt --all -- --check
      # -D warnings escalates the workspace safety lints (arithmetic_side_effects,
      # cast_possible_truncation, undocumented_unsafe_blocks, missing_safety_doc)
      # to hard errors. Explicit -D flags are belt-and-suspenders (LESSONS #3).
      - run: >
          cargo clippy --all-targets --
          -D warnings
          -D clippy::missing_safety_doc
          -D clippy::undocumented_unsafe_blocks
      - run: cargo test --all

  unsafe-audit:
    name: unsafe-audit (hard fail on undocumented unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Fails if ANY `unsafe {}` block lacks a // SAFETY: comment. Run from repo
      # root against the workspace crates.
      - run: python3 porting-kit/harnesses/unsafe-audit/audit_unsafe.py nmap-rs/crates/
        working-directory: .

  supply-chain:
    name: supply-chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master  # pinned via rust-toolchain.toml (LESSONS #16)
        with: { toolchain: "1.97.0" }
      - run: cargo install cargo-audit cargo-deny --locked
      - run: cargo audit
      - run: cargo deny check

  miri:
    name: miri (UB in unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - run: cargo +nightly miri test

  # NOTE: no ThreadSanitizer gate. The host-group driver's race-freedom is
  # *structural* — all scheduler state is mutated by the single driver task and
  # probe tasks capture only `Copy`/owned data, so `JoinSet::spawn`'s `Send`
  # bound rejects shared mutable state at compile time. Full-program TSan of a
  # tokio multi-threaded runtime reports false positives from tokio's own
  # lock-free scheduler (and app code runs *inside* the runtime, so suppressions
  # can't cleanly separate the two), which makes it an unsound gate here rather
  # than a safe one. See LESSONS (M2 retrospective).

  # --- Gates below activate as their inputs land (kept wired, self-skip until then) ---

  fuzz-smoke:
    name: fuzz (60s smoke per untrusted-input parser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src }
      - run: |
          if [ ! -d fuzz ]; then echo "no fuzz/ dir yet — skipping"; exit 0; fi
          cargo install cargo-fuzz --locked
          # Fuzz each target from its hand-authored seed corpus. Any panic/crash
          # on arbitrary input is a release blocker (Phase 4, gate 3).
          # Invoke with +nightly explicitly: cargo-fuzz needs -Zsanitizer, and the
          # repo's rust-toolchain.toml (a *directory* override, pinning stable) would
          # otherwise outrank the job's nightly default and fail the inner build
          # (LESSONS #16 — the pin interacts with nightly-only gates).
          for t in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run "$t" fuzz/seeds/"$t" -- -max_total_time=60 -print_final_stats=1
          done

  differential:
    name: differential vs C nmap oracle (M1 connect scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master  # pinned via rust-toolchain.toml (LESSONS #16)
        with: { toolchain: "1.97.0" }
      # The C oracle: distro nmap. project.py compares only the semantic scan
      # result (host status + open-port state/reason + closed counts), so the
      # exact nmap version's decorative output does not affect the verdict.
      - run: sudo apt-get update && sudo apt-get install -y nmap
      - run: cargo build --release
      # Fixture listeners + both binaries + diff_run.py over the M1 matrix.
      # Fails on any UNLEDGERED divergence in port-state fidelity.
      - run: bash tests/differential/run_differential.sh
      # M5: the OS-detection differential. Unlike every earlier M5 gate (static C-oracle
      # vectors, or the real nmap-os-db), this exercises the whole path on the wire —
      # building the 23-probe battery, capturing on a real interface, attributing replies,
      # and assembling a fingerprint — against C nmap fingerprinting the same host.
      # Needs raw sockets and a pcap build; the script SKIPs cleanly without them.
      - run: sudo apt-get install -y libpcap-dev
      - run: cargo build --release --features pcap
      - run: sudo -E env "PATH=$PATH" bash tests/differential/m5/run_os_differential.sh
      # M4/M5 packet-walk differential: rebuild the C PacketParser oracle and
      # regenerate the committed corpus + golden, then require them to be unchanged.
      # The cargo test compares against the committed golden, so without this step a
      # hand-edited golden would prove agreement with a paraphrase of the C rather
      # than with nmap itself.
      - run: bash tests/differential/m4/regen_pkt_golden.sh --check
      # M5 IPv6 probe battery: rebuild the C FPHost6::build_probe_list() oracle,
      # regenerate the committed corpus + golden, and require them unchanged, then run
      # the byte-exact differential. Same anti-paraphrase guard as the other goldens.
      - run: bash tests/differential/m5/regen_build6.sh --check
      - run: cargo test -p nmap-core --test build6_differential
      # M5 IPv6 response matching: rebuild nmap's real PacketParser::is_response oracle,
      # regenerate the committed corpus + golden, require them unchanged, then run the
      # verdict-exact differential.
      - run: bash tests/differential/m5/regen_fp6match.sh --check
      - run: cargo test -p nmap-core --test fp6match_differential
      # M5 IPv6: the classifier differential. Builds an oracle that links liblinear's own
      # predict_values against nmap's real 2.8 MB model tables, and requires bit-exact
      # agreement — the port replaces that whole library with a dot product, so "close
      # enough" is not a sufficient check.
      - run: bash tests/differential/m5/oracle/build_fp6_oracle.sh
      - run: cargo test -p nmap-core --test fpmodel_differential
      # M5 IPv6: the vectorize differential. Rebuilds nmap's real vectorize() (pasted
      # verbatim, linked against the real libnetutil parser), regenerates the committed
      # corpus + golden and requires them unchanged, then diffs the Rust port against it
      # bit-for-bit — the same re-derive-from-C guard the packet golden uses.
      - run: bash tests/differential/m5/regen_fp6_vectorize.sh --check
      - run: cargo test -p nmap-core --test fp6_vectorize_differential
      # M5 IPv6: the neighbor-discovery differential. Rebuilds nmap's real doND()
      # frame construction and reply validation (pasted verbatim, packed by the real
      # libdnet macros), regenerates the committed corpus + golden and requires them
      # unchanged, then gates the solicitation on byte identity and the advertisement
      # reader on verdict identity.
      - run: bash tests/differential/m5/regen_ndp.sh --check
      - run: cargo test -p nmap-core --test ndp_differential
