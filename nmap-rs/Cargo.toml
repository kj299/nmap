# Architecture skeleton for a safety-first C-to-Rust port. Copy this directory to
# your new project root and rename the crates. The layering (see
# ../ARCHITECTURE-TEMPLATE.md) makes safety STRUCTURAL:
#   core   : #![forbid(unsafe_code)]  — all pure logic lives here, testable anywhere
#   sys    : the only FIRST-PARTY crate allowed unsafe — FFI wrapped in audited
#            safe fns + RAII
#   vendor : third-party source we ship (M6.0 onward: the Lua VM). Not written
#            here and not `forbid`-able, so it is held to the same SAFETY
#            documentation standard instead, by the same two gates that cover
#            `sys` — audit_unsafe.py and clippy's undocumented_unsafe_blocks —
#            plus a provenance check that re-derives it from upstream + patches.
#            See crates/vendor/piccolo/PROVENANCE.md.
#   cli  : thin — parse -> core -> render
[workspace]
resolver = "2"
members = ["crates/core", "crates/sys", "crates/cli", "crates/vendor/piccolo"]

# `crates/vendor/` holds third-party source we ship, currently just the Lua VM.
# It is a workspace MEMBER and sits under `crates/` for one reason each, both
# measured (docs/M6-ANALYSIS.md, Decision 4): `audit_unsafe.py` has no
# `--exclude`, so the path CI walks (`nmap-rs/crates/`) is the only exclusion
# mechanism there is; and clippy's `undocumented_unsafe_blocks` fires on a
# workspace member and is silent on a registry dependency (14 findings vs 0).
# Vendored code that no gate can see is the failure this layout exists to avoid.

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
# MEASURED, not aspirational: the workspace builds on 1.88 and fails on 1.87.
# Enforced by the `msrv` CI job, which reads THIS line and builds with it — so the
# gate can never quietly disagree with the declaration.
#
# What sets it is the dependency tree, not this port's own code (which needs 1.81
# for lint `reason = "..."`). Two constraints, neither of them visible in any
# crate's `rust-version` field, which is why this has to be verified by building:
#   * `mac-addr 0.3.0` (via `netdev`) is edition 2024 -> Cargo 1.85+. A too-old
#     Cargo cannot even PARSE its manifest, so this fails at download time.
#   * `netdev 0.45.0` uses let-chains -> rustc 1.88+.
#
# This sat at "1.74" through five milestones while the tree had long since needed
# more, because nothing built at it (CI pins 1.97.0 via rust-toolchain.toml).
# A declaration nothing enforces is a declaration that rots — LESSONS #003/#021,
# and the same failure this file's own PLAN.md tracker had.
rust-version = "1.88"

[profile.release]
# Overflow checks ON even in release: silent wraparound is exactly the class of
# C bug a safety-first rewrite must not reproduce. Cheap insurance.
overflow-checks = true
lto = true

# Workspace-wide safety lints (every crate opts in via `[lints] workspace = true`).
# These are the compiler/clippy half of the unsafe-doc gate: the Python
# audit harness covers `unsafe {}` blocks with no toolchain; clippy's
# missing_safety_doc covers `unsafe fn` `# Safety` sections, which the harness
# deliberately does not (LESSONS #3 — this delegation was previously unwired).
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"   # cross-checks the audit harness
missing_safety_doc = "warn"           # every `pub unsafe fn` needs `# Safety`
# Reject the C-idiom footguns a safety rewrite must not carry over:
cast_possible_truncation = "warn"     # `x as u16` on a length/offset from input
arithmetic_side_effects = "warn"      # unchecked +/-/* that can overflow
