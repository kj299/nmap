[package]
name = "nmap-core"
version = "0.1.0"
publish = false          # application crate; never published to crates.io
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Keep the trusted surface small. Every dependency added here must clear the
# supply-chain gate (porting-kit/harnesses/supply-chain). `core` is
# #![forbid(unsafe_code)] — the crates below expose safe APIs; their internal
# unsafe is their own audited concern, not reachable from this crate's code.
[dependencies]
# `core::matcher` — the hybrid service-detection regex engine. `regex` is the
# finite-automaton default (linear-time, ReDoS-immune); `fancy-regex` is the
# bounded-backtracking fallback for the ~6% of probes that need lookaround /
# backreferences / atomic groups (its backtrack limit is the analog of nmap's
# PCRE2 match_limit). See docs/M3-ANALYSIS.md for why this split.
regex = "1"
fancy-regex = "0.13"

# `core::sigstore::verify` — Ed25519 verification of the signature-bundle manifest.
# Verify-only: no signing, no key generation, no RNG, no PKCS#8/PEM parsing, no
# serde. `default-features = false` turns off `std`, `zeroize` (there is no secret
# key here to scrub) and `fast` (30 KiB of precomputed basepoint tables, measured
# worth 5% on an operation that runs once per invocation). The verify path needs
# no features at all.
#
# `legacy_compatibility` must NEVER be enabled: it degrades the RFC 8032
# `0 <= s < L` check to a top-three-bits test and reintroduces signature
# malleability. See DIVERGENCES.md `sigstore-verify-strict`.
#
# The `=` pin's ORIGINAL reason has lapsed, and is recorded here rather than
# quietly restated: it was chosen when the workspace declared MSRV 1.74, because
# ed25519-dalek 2.2.0 needs rustc 1.81 and 3.0.0 needs 1.85, and `resolver = "2"`
# is not MSRV-aware, so a caret requirement resolved to 2.2.0 and broke the build.
# The declared MSRV is now 1.88 (measured), so neither release is out of reach and
# that argument no longer holds.
#
# The pin is left in place because relaxing it changes which code verifies
# signatures, and that is a deliberate decision rather than a side effect of an
# MSRV correction. Note the cost while it stands: `=` leaves no room for a patch
# release, so a RUSTSEC advisory against 2.1.1 would have to be answered by editing
# this line under time pressure. Cargo.lock is what makes builds reproducible, so
# relaxing this to `"2.1.1"` (caret) would restore that headroom without changing
# the version actually built until someone runs `cargo update`. Tracked in
# BACKLOG.md.
ed25519-dalek = { version = "=2.1.1", default-features = false }

[lints]
workspace = true
