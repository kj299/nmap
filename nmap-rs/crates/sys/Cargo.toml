[package]
name = "nmap-sys"
version = "0.1.0"
publish = false          # application crate; never published to crates.io
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The only FIRST-PARTY crate permitted `unsafe` (the vendored Lua VM in
# crates/vendor/piccolo holds its own, audited the same way). FFI is wrapped
# here in audited safe fns; the unsafe-audit harness runs over crates/ in CI and
# HARD-FAILS on any undocumented block. Today its `unsafe` is the 11 blocks of
# the `raw-ffi` getifaddrs(3) cross-check in src/netif/ffi.rs.
[dependencies]
nmap-core = { path = "../core" }
# Interface / route / MTU enumeration — the DEFAULT backend. `netdev` is a vetted,
# cross-platform (Windows/Linux/macOS) crate whose own OS-specific `unsafe` is
# audited upstream, so THIS crate stays at 0 `unsafe` for the whole OS-query layer.
# It supplies exactly the fields the raw send path needs (per-address prefix, MTU,
# MAC, default gateway) — safer and more complete than hand-rolling `getifaddrs` /
# `GetAdaptersAddresses` ourselves. `unsafe` is thus reserved for Npcap, where no
# safe equivalent exists.
netdev = "0.45"
# Async runtime + safe socket API for the connect scan. tokio's networking is a
# safe wrapper over the OS (Winsock/IOCP on Windows, epoll/kqueue elsewhere), so
# this crate still holds ~0 unsafe for the MVP. Feature set kept minimal.
tokio = { version = "1", features = ["net", "time", "rt", "rt-multi-thread", "macros", "io-util", "sync"] }
# Real packet-capture / injection backend (feature `pcap`). Wraps libpcap on Unix and
# Npcap on Windows — the same library nmap uses — behind a mostly-safe API whose FFI
# is audited upstream. Optional because it needs libpcap/Npcap headers at BUILD time,
# which the default CI image lacks; the `capture` seam + async plumbing build and test
# without it.
pcap = { version = "2", optional = true }
socket2 = "0.6.5"
# The TLS client (M6.5 step f1, `sys::tls`; D3, docs/M6.5-ANALYSIS.md §14.1):
# rustls 0.23 over a first-party CryptoProvider, never ring or aws-lc (the C
# ban in deny.toml). The primitives are RustCrypto's, of the digest-0.10 /
# cipher-0.4 generation the tree already locks (sha2, aes, ed25519-dalek's
# curve25519-dalek): AES-GCM and ChaCha20-Poly1305, HMAC, ECDH and ECDSA on
# P-256/P-384/P-521, X25519. RSA verification is first-party over
# num-bigint (the `rsa` crate carries RUSTSEC-2023-0071). Randomness is the
# one seam of `core::nse::openssl::rand` (E3); rand_core only adapts it.
#
# Except the NIST curves: p256/p384/p521 are on 0.14, the digest-0.11 /
# rand_core-0.10 generation, because 0.13 pulls crypto-bigint 0.5, which
# carries RUSTSEC-2026-0387 (timing variability in its constant-time
# operations; fixed in 0.7.6). Until sha2, hmac, the AEADs and the dalek
# crates follow, the lock holds both generations of their support crates
# (digest, sha2, hmac, signature, rand_core, ...), which deny.toml reports as
# duplicate warnings; the TLS seam implements both rand_core versions.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std"] }
p384 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std"] }
p521 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "std"] }
x25519-dalek = { version = "2", default-features = false, features = ["zeroize"] }
ed25519-dalek = { version = "2.1.1", default-features = false }
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
# M6.7 step a (docs/M6.7-ANALYSIS.md §14): AES-CCM and CCM-8 (`ccm` over
# `aes`) and ARIA-GCM (`aria` under `aes-gcm`'s generic GCM), each measured in
# step 0: no unsafe, no build script, deny and MSRV clean. FFDHE and X448 over
# crypto-bigint's constant-time Montgomery arithmetic, already in the tree
# through the NIST curves; no secret meets num-bigint (docs/M6.5-ANALYSIS.md).
aes = { version = "0.8", default-features = false }
ccm = { version = "0.5", default-features = false }
aria = { version = "0.1", default-features = false }
crypto-bigint = { version = "0.7.10", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false }
rand_core = { version = "0.6", default-features = false }

[features]
default = []
# The hand-FFI ESCAPE HATCH (Option C). Off by default. Enables a direct
# `getifaddrs(3)` backend (`interfaces_ffi`) used to (a) cross-check that `netdev`
# agrees with the raw OS call, and (b) reach a field `netdev` might not expose. The
# only place `unsafe` re-enters the OS-query layer, and always audited.
raw-ffi = []
# The real libpcap/Npcap capture backend. Off by default (needs libpcap at build
# time). The OS-agnostic capture plumbing (blocking-thread -> tokio mpsc, per spike
# S1) is always built and tested against a mock source; this feature swaps in the
# live source, validated on a privileged host.
pcap = ["dep:pcap"]

[target.'cfg(unix)'.dependencies]
# Always on for unix since M6.6 step a, for a constant: `O_NONBLOCK`, with which
# `datadir::read_data_file` opens a data file so that a FIFO in its place cannot
# block the scan (`datafile-special-file-refused`). No `unsafe` comes with it; the
# FFI calls stay behind `raw-ffi`. Already in the tree through tokio and socket2.
libc = "0.2"

[lints]
workspace = true
