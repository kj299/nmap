# M1 connect-scan differential matrix — the behavioral contract nmap-rs must
# match against C nmap, over the loopback fixture in run_differential.sh
# (open ports 18080 & 18443 have listeners; every other port is closed → RST).
#
# Each [[case]] runs BOTH tools with `args`; the wrapper appends `-oX -` and pipes
# through project.py, so we compare the canonical semantic projection (host
# status + open-port state/reason + closed/filtered counts), not raw output.
# `-Pn` makes host state deterministic (no discovery variance); `-n` skips rDNS.
# Grow this every time a bug escapes: add the case that would have caught it.

[[case]]
name = "mixed-open-closed"
args = ["-sT", "-Pn", "-n", "-p", "18080,18443,18081,19999", "127.0.0.1"]

[[case]]
name = "single-open"
args = ["-sT", "-Pn", "-n", "-p", "18080", "127.0.0.1"]

[[case]]
name = "all-closed"
args = ["-sT", "-Pn", "-n", "-p", "18081,18082,19998,19999", "127.0.0.1"]

# Range spec (18078-18082): exercises port-range expansion; only 18080 is open.
[[case]]
name = "port-range"
args = ["-sT", "-Pn", "-n", "-p", "18078-18082", "127.0.0.1"]

# List + range mixed, out of order: canonical projection sorts, so order-agnostic.
[[case]]
name = "list-and-range-unsorted"
args = ["-sT", "-Pn", "-n", "-p", "19999,18080-18081,18443", "127.0.0.1"]

# Multi-host group: 127.0.0.1 has the listeners, 127.0.0.2 (also loopback) does
# not. Exercises the shared group window across hosts. The projection aggregates
# closed counts across both hosts, so both tools must agree on the totals.
[[case]]
name = "two-host-group"
args = ["-sT", "-Pn", "-n", "-p", "18080,18443,18081", "127.0.0.1", "127.0.0.2"]

# Rate-limited: --max-rate must not change the results, only the pacing.
[[case]]
name = "mixed-max-rate"
args = ["-sT", "-Pn", "-n", "--max-rate", "5000", "-p", "18080,18443,18081,19999", "127.0.0.1"]

# Min-rate floor: likewise result-invariant.
[[case]]
name = "mixed-min-rate"
args = ["-sT", "-Pn", "-n", "--min-rate", "100", "-p", "18080,18443,18081,19999", "127.0.0.1"]

# M3 service/version detection: port 18022 emits an SSH banner, so both tools
# must detect service "ssh" on it. The projection includes `service <port> ssh`
# for probe-detected (method="probed") services; product/version are excluded
# (they vary with each tool's probe-DB version). Silent open ports are omitted
# from this case so the -sV verdict is deterministic across nmap versions.
[[case]]
name = "sv-ssh-banner"
args = ["-sV", "-Pn", "-n", "-p", "18022", "127.0.0.1"]

# ---- `-sL` list scan (M7.6) ------------------------------------------------
# The dry run: expand the targets, print them, send nothing. C sets listscan +
# noportscan + PINGTYPE_NONE (nmap.cc:1307), so these cases also assert that
# neither tool reports port state or host liveness for a scan that probed
# nothing — host status must be `unknown`, not a guessed `down`.
#
# `-n` is load-bearing here rather than just deterministic: C does reverse DNS
# in a list scan by default and this port resolves nothing anywhere, so without
# it the two disagree on the hostname for 127.0.0.1 (`localhost` vs none). That
# is the port's standing no-resolution scope decision, not a list-scan bug.
[[case]]
name = "list-scan-single"
args = ["-sL", "-n", "127.0.0.1"]

# Range expansion with no probing: the target set is the whole result.
[[case]]
name = "list-scan-range"
args = ["-sL", "-n", "127.0.0.1-3"]

# Exclusion applies to a list scan exactly as to a real one — the dry run has to
# tell you what a real scan WOULD do, so if these ever diverge the preview is
# lying about the scan it previews.
[[case]]
name = "list-scan-with-exclusion"
args = ["-sL", "-n", "--exclude", "127.0.0.2", "127.0.0.1-3"]

# ---- the -T group (M7.7) ---------------------------------------------------
# Timing options change *pacing*, which the output does not show — so what
# these cases actually prove is the thing most worth proving: that selecting a
# template does not change the RESULT. A scan run at -T4 must classify the same
# ports the same way as one run at the default, or the speed was bought by
# getting answers wrong.
[[case]]
name = "timing-template-aggressive"
args = ["-sT", "-Pn", "-n", "-T4", "-p", "18080,18443,18081,19999", "127.0.0.1"]

# The explicit knobs, same argument: tightening the RTT bounds and capping
# retries must not change any port's verdict on a local target that answers
# immediately.
[[case]]
name = "timing-explicit-rtt-bounds"
args = [
  "-sT", "-Pn", "-n",
  "--min-rtt-timeout", "50ms",
  "--max-rtt-timeout", "800ms",
  "--initial-rtt-timeout", "200ms",
  "--max-retries", "2",
  "-p", "18080,18443,18081,19999", "127.0.0.1",
]

# A scan delay is the one timing option whose effect is visible in the elapsed
# time rather than the port table, so this case is deliberately tiny: three
# ports at 20ms apart, just enough that both tools take the delay and neither
# takes long enough to make the suite slow.
[[case]]
name = "timing-scan-delay"
args = ["-sT", "-Pn", "-n", "--scan-delay", "20ms", "-p", "18080,18443,19999", "127.0.0.1"]

# -T5 on a list scan: no packets, so this isolates the template's effect on the
# option parsing and the report from its effect on the wire.
[[case]]
name = "timing-template-insane-listscan"
args = ["-sL", "-n", "-T5", "127.0.0.1-3"]

# ---- port selection (M7.8) -------------------------------------------------
# The identity of each selected set is checked against C nmap's own
# --packet-trace output by the unit tests in crates/cli/src/main.rs. These cases
# prove the selection survives the whole pipeline and reaches the wire, which a
# unit test over `select_ports` cannot.
#
# Both sides read this repository's nmap-services (the harness passes --datadir
# to C nmap), so a ranking difference here is a real divergence and not two
# databases disagreeing.
[[case]]
name = "top-ports-10"
args = ["-sT", "-Pn", "-n", "--top-ports", "10", "127.0.0.1"]

[[case]]
name = "fast-scan"
args = ["-sT", "-Pn", "-n", "-F", "127.0.0.1"]

[[case]]
name = "port-ratio"
args = ["-sT", "-Pn", "-n", "--port-ratio", "0.05", "127.0.0.1"]

# Exclusion reaching the scan, on the fixture's own ports so the result is
# visible as open/closed rather than only as a count: 18081 and 19999 are
# dropped, so the two open ports remain and nothing is left closed.
[[case]]
name = "exclude-ports"
args = [
  "-sT", "-Pn", "-n",
  "-p", "18080,18443,18081,19999",
  "--exclude-ports", "18081,19999",
  "127.0.0.1",
]
