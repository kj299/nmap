# Safety-first CI for a C-to-Rust port. Copy to .github/workflows/ci.yml and tune.
# The matrix is organized around SAFETY GATES, not OS coverage — the point of the
# rewrite is safety, so the pipeline centers on proving it. Keep a small OS row if
# your port is cross-platform; it is not the focus.
#
# Gates (each PLAYBOOK Phase 4 / cross-cutting control):
#   build+test | clippy -D warnings | unsafe-audit (HARD FAIL) | miri |
#   sanitizers | fuzz smoke | supply-chain (audit + deny) | differential
name: porting-ci

# LESSONS #5 — path-scope CI to what it actually builds. During a gradual port the
# C tree and the Rust workspace coexist in one repo; an unscoped `on: [push]` runs
# this whole safety pipeline on changes it cannot affect (docs, the C tree), wasting
# CI and leaving PRs misleadingly "unstable" while unrelated jobs drain. Scope this
# Rust workflow to the Rust paths, and scope the C workflow to the C paths, so each
# change triggers only the pipeline that can be affected by it. Tune the globs.
#
# LESSONS #025 — scope `push` to the DEFAULT BRANCH only. An unfiltered `push`
# alongside `pull_request` runs this entire pipeline TWICE for every pull request:
# once for the branch push, once for the PR. nmap shipped that way for five
# milestones and only noticed when a sharded fuzz matrix turned 12 duplicate checks
# into 22. A PR's own `pull_request` run already covers the branch — and covers it
# better, testing the merge commit rather than the branch head in isolation — and
# re-runs on every force-push via the default `synchronize` activity. Trade-off,
# deliberately accepted: a topic branch pushed with NO open pull request is not
# built until a PR is opened for it.
on:
  push:
    branches: [main, master]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/porting-ci.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/porting-ci.yml']

# Supersede a PR's in-flight run when it is force-pushed: a safety pipeline with a
# fuzz matrix runs for tens of minutes, and a stale run is pure waste whose result
# describes code that no longer exists. Never cancel on the default branch — an
# intermediate merge commit's run is the only evidence that commit was green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-test:
    name: build + test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # LESSONS #16 — pin the toolchain, do not float `@stable`. `@stable` installs
      # whatever stable is current the day CI runs, so a rustfmt reflow or a new
      # clippy lint that landed since your local stable fails the PR on a version you
      # never ran. `@master` reads the repo's `rust-toolchain.toml` (ship it from
      # skeleton/) so `cargo fmt`/`cargo clippy` here use the EXACT version you ran
      # locally. Nightly gates below stay `@nightly` (they override the pin).
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "1.97.0", components: clippy, rustfmt }
      - run: cargo fmt --all -- --check
      # -D warnings escalates the workspace safety lints (see skeleton Cargo.toml
      # [workspace.lints]) to hard errors. The explicit -D flags below are
      # belt-and-suspenders so this gate holds even if a repo copies this CI
      # without the [workspace.lints] table — every `unsafe fn` needs `# Safety`,
      # every `unsafe {}` a doc (cross-checks the audit harness). (LESSONS #3)
      - run: >
          cargo clippy --all-targets --
          -D warnings
          -D clippy::missing_safety_doc
          -D clippy::undocumented_unsafe_blocks
      - run: cargo test --all

  unsafe-audit:
    name: unsafe-audit (hard fail on undocumented unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Fails the build if ANY `unsafe {}` block lacks a // SAFETY: comment.
      - run: python3 porting-kit/harnesses/unsafe-audit/audit_unsafe.py crates/
      # Fails the build if a shipped module never reached progress.json. Keeping
      # the table current was a habit and rotted to 12 untracked modules in one
      # milestone; the retrospective reads this file as a primary artifact, so a
      # stale table misleads the very review meant to catch drift (LESSONS #021).
      - run: python3 porting-kit/harnesses/progress/progress.py --file progress.json drift --src crates

  miri:
    name: miri (UB in unsafe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - run: cargo +nightly miri test

  sanitizers:
    name: sanitizers (asan + ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: bash porting-kit/harnesses/sanitizers/run_sanitizers.sh asan .
      - run: bash porting-kit/harnesses/sanitizers/run_sanitizers.sh ubsan .

  # Sharded across a matrix: the smoke is 60s PER TARGET, so a single job grows
  # linearly as targets accumulate (nmap reached ~38 minutes of pure fuzzing).
  # Each shard fuzzes a slice, so wall-clock is the slice plus fixed overhead.
  # `fail-fast: false` because a crash in one shard must not cancel the others —
  # the point of this gate is to see every failure, not only the first.
  fuzz-smoke:
    name: fuzz shard ${{ matrix.shard }} (60s smoke per target)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz
      # Compile every target BEFORE fuzzing any of them (LESSONS #023). The fuzz
      # crate is NOT part of `cargo clippy --workspace --all-targets` — it is a
      # separate crate — so adding a field to a type a fuzz target constructs passes
      # every other local and CI check. Without this step that compile error surfaces
      # only after the first target has fuzzed its full 60s, tens of minutes in; with
      # it the job fails in about a minute. No target name = build them all at once.
      - name: fuzz targets compile
        run: cargo +nightly fuzz build
      # Short smoke in CI; schedule a nightly deep run separately.
      # Use +nightly explicitly: cargo-fuzz needs -Zsanitizer, and a pinned
      # rust-toolchain.toml (shipped from skeleton/, a *directory* override) would
      # otherwise outrank the job's nightly default and fail the inner build
      # (LESSONS #16 — the stable pin interacts with nightly-only gates).
      # Round-robin by line number, with the shard count taken from
      # `strategy.job-total` so the split follows the matrix automatically — adding a
      # shard needs no second edit, and no target can be dropped or run twice.
      - name: fuzz smoke run
        run: |
          targets=$(cargo +nightly fuzz list 2>/dev/null \
            | awk -v s=${{ matrix.shard }} -v n=${{ strategy.job-total }} 'NR % n == s % n')
          if [ -z "$targets" ]; then
            echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }}: no targets"; exit 0
          fi
          echo "shard ${{ matrix.shard }} of ${{ strategy.job-total }} runs:"; echo "$targets"
          for t in $targets; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60
          done

  supply-chain:
    name: supply-chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master  # pinned via rust-toolchain.toml (LESSONS #16)
        with: { toolchain: "1.97.0" }
      - run: cargo install cargo-audit cargo-deny
      - run: bash porting-kit/harnesses/supply-chain/run_supply_chain.sh .

  differential:
    name: differential vs C oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master  # pinned via rust-toolchain.toml (LESSONS #16)
        with: { toolchain: "1.97.0" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Build both, then diff over the input matrix. If the C reference can't run
      # here, replace --oracle with the golden-replay wrapper (harnesses/golden).
      - run: |
          cargo build --release
          # ./build-c-oracle.sh   # your C build
          python3 porting-kit/harnesses/differential/diff_run.py \
            --oracle ./c-oracle --rust ./target/release/<binary> \
            --matrix porting-kit/harnesses/differential/input-matrix.example.toml \
            --ledger DIVERGENCES.md
